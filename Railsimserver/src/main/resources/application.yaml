spring:
  application:
    name: railsimserver
  threads:
    virtual:
      # Each RailsimRunnerTask blocks while sleeping; virtual threads make that cheap
      # and remove the 8-thread cap of the default applicationTaskExecutor.
      enabled: true
  task:
    scheduling:
      pool:
        size: 5
  jackson:
    serialization:
      INDENT_OUTPUT: true
    mapper:
      default-view-inclusion: true
  datasource:
    url: jdbc:postgresql://rk1-b:5432/railsim
    username: railsim
    password: railsim
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.default_batch_fetch_size: 50
server:
  port: 8083
sim:
  rate-multiplier: 1
